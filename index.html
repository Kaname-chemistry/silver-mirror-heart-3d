<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

/* ================================================================
   Chemistry
   RCHO + 2[Ag(NH3)2]+ + 3OH- -> RCOO- + 2Ag + 4NH3 + 2H2O
   ================================================================ */
const SUBST = {
  glucose:  { name: 'グルコース（ブドウ糖）', k: 1.0, why: '水溶液中で鎖状の構造になると、アルデヒド基（ホルミル基）をもつ。アルデヒド基が酸化され、銀イオンが還元されて銀になる。' },
  fructose: { name: 'フルクトース（果糖）', k: 0.75, why: '鎖状の構造で –CO–CH₂OH の部分をもち、これが還元性を示す（ケトンだが例外）。' },
  sucrose:  { name: 'スクロース（ショ糖・砂糖）', k: 0, why: 'グルコースとフルクトースの、還元性を示す部分どうしで結合しているため、還元性を示さない。' },
  acetone:  { name: 'アセトン', k: 0, why: 'ケトンは還元性を示さない。' },
};
const AG_MG = 1.0e-3 * 107.87 * 1000;   // 108 mg of silver at most
const SPEED = 30;                       // lab seconds per real second
const K60 = 1 / 150;                    // 1/s at 60 °C for glucose
const kOf = (T, s) => SUBST[s].k * K60 * Math.exp(0.06 * (T - 60));
function mirrorShare(T, clean, shaking) {
  let f = clean ? 0.92 : 0.3;
  if (T > 75) f *= Math.max(0.1, 1 - (T - 75) * 0.055);
  if (shaking) f *= 0.25;
  return f;
}
const starsOf = (mg) => { const q = mg / (AG_MG * 0.9); return q >= 0.8 ? 3 : q >= 0.55 ? 2 : q >= 0.3 ? 1 : 0; };

/* ================================================================
   Renderer, scene, camera
   ================================================================ */
const srgb = (r, g, b) => new THREE.Color().setRGB(r, g, b, THREE.SRGBColorSpace);
const isMobile = matchMedia('(pointer:coarse)').matches || Math.min(innerWidth, innerHeight) < 600;
const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance', preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, isMobile ? 1.75 : 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.localClippingEnabled = true;
const ANISO = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
scene.background = srgb(0.79, 0.83, 0.86);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.3, 500);
scene.add(camera);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 8; controls.maxDistance = 120; controls.maxPolarAngle = 1.52; controls.minPolarAngle = 0.1;
function frameCamera() {
  const a = innerWidth / innerHeight;
  const dist = a < 1 ? 44 : 36;
  controls.target.set(a < 1 ? 3.2 : 5, a < 1 ? 7.5 : 7.4, 0);
  camera.position.copy(controls.target).addScaledVector(new THREE.Vector3(0.05, 0.2, 0.98).normalize(), dist);
  controls.update();
}
frameCamera();

scene.add(new THREE.HemisphereLight(0xffffff, 0x7b838a, 0.95));
const sun = new THREE.DirectionalLight(0xfff8ee, 2.2);
sun.position.set(20, 50, 30); sun.target.position.set(0, 0, 0);
sun.castShadow = true;
sun.shadow.mapSize.set(isMobile ? 1024 : 2048, isMobile ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -20, near: 10, far: 120 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04; sun.shadow.radius = 4;
scene.add(sun, sun.target);
const fillL = new THREE.DirectionalLight(0xe6efff, 0.55); fillL.position.set(-30, 20, 20); scene.add(fillL);

/* ---------- helpers ---------- */
const V2 = (x, y) => new THREE.Vector2(x, y);
const JP = '"Hiragino Sans","Noto Sans JP","Yu Gothic UI",IPAPGothic,system-ui,sans-serif';
function tex(w, h, draw, o = {}) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  if (o.srgb !== false) t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = ANISO;
  if (o.rep) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(o.rep[0], o.rep[1]); }
  t.userData.canvas = c;
  return t;
}
function add(geo, mat, o = {}) {
  const m = new THREE.Mesh(geo, mat);
  if (o.p) m.position.set(...o.p);
  if (o.r) m.rotation.set(...o.r);
  if (o.s) m.scale.set(...o.s);
  m.castShadow = !!o.cast; m.receiveShadow = !!o.recv;
  if (o.ro !== undefined) m.renderOrder = o.ro;
  (o.to || scene).add(m);
  return m;
}
function glass(o = {}) {
  const m = new THREE.MeshPhysicalMaterial({ color: o.color ?? 0xffffff, roughness: 0.04, metalness: 0, ior: 1.5,
    transparent: true, opacity: o.op ?? 0.12, depthWrite: false, side: THREE.DoubleSide, envMapIntensity: o.env ?? 1.6 });
  const k = (o.edge ?? 0.5).toFixed(2);
  m.onBeforeCompile = (sh) => {
    sh.fragmentShader = sh.fragmentShader.replace('#include <opaque_fragment>',
      `{ float e = 1.0 - abs(dot(normalize(normal), normalize(vViewPosition)));
         e = e * e * e; diffuseColor.a = clamp(diffuseColor.a + e * ${k}, 0.0, 0.9); outgoingLight += vec3(e * 0.05); }
       #include <opaque_fragment>`);
  };
  m.customProgramCacheKey = () => 'g' + k;
  return m;
}
const clamp01 = (x) => Math.max(0, Math.min(1, x));
const ease = (t) => t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

/* ================================================================
   Room
   ================================================================ */
const benchMap = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#3b4044'; g.fillRect(0, 0, w, h);
  const im = g.getImageData(0, 0, w, h), d = im.data;
  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 16; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(im, 0, 0);
}, { rep: [5, 2.5] });
add(new THREE.BoxGeometry(140, 4, 60), new THREE.MeshStandardMaterial({ map: benchMap, roughness: 0.94, envMapIntensity: 0.45 }), { p: [4, -2, -4], recv: true });
const wallMap = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#c1c9cf'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
    const v = 230 + ((i * 7 + j * 3) % 9); g.fillStyle = `rgb(${v - 3},${v + 1},${v + 4})`;
    g.fillRect(i * 128 + 3, j * 128 + 3, 122, 122);
  }
}, { rep: [12, 6] });
add(new THREE.PlaneGeometry(140, 70), new THREE.MeshStandardMaterial({ map: wallMap, roughness: 0.55, envMapIntensity: 0.6 }), { p: [4, 35, -24], recv: true });

/* ================================================================
   Hot plate + water bath + thermometer + stand
   ================================================================ */
const castIron = new THREE.MeshStandardMaterial({ color: 0x2d3338, metalness: 0.4, roughness: 0.55 });
const chrome = new THREE.MeshStandardMaterial({ color: 0xd2d6da, metalness: 1, roughness: 0.22 });
const PLATE_Y = 1.6;
add(new RoundedBoxGeometry(14, 1.6, 11, 3, 0.4), new THREE.MeshStandardMaterial({ color: 0xeceff1, roughness: 0.5 }), { p: [0, 0.8, 0], cast: true, recv: true });
add(new THREE.CylinderGeometry(6.0, 6.0, 0.12, 48), new THREE.MeshStandardMaterial({ color: 0x8e979e, metalness: 0.8, roughness: 0.4 }), { p: [0, PLATE_Y + 0.02, 0], recv: true });
const dial = add(new THREE.CylinderGeometry(0.7, 0.7, 0.6, 24), new THREE.MeshStandardMaterial({ color: 0x23282d, roughness: 0.5 }), { p: [4.6, 0.85, 5.6], r: [Math.PI / 2, 0, 0] });
add(new THREE.BoxGeometry(0.18, 0.5, 0.1), new THREE.MeshStandardMaterial({ color: 0xffffff }), { p: [0, 0.35, 0.32], r: [-Math.PI / 2, 0, 0], to: dial });
const hpLed = add(new THREE.SphereGeometry(0.18, 12, 8), new THREE.MeshStandardMaterial({ color: 0x331111, emissive: 0xff2a2a, emissiveIntensity: 1.5 }), { p: [2.6, 1.05, 5.55] });
const BR = 6.0, BH = 10.5, WATER = 8.4;
{
  const pts = [V2(0, 0), V2(BR - 0.3, 0), V2(BR, 0.3), V2(BR, BH), V2(BR + 0.25, BH + 0.15), V2(BR - 0.08, BH + 0.05), V2(BR - 0.1, 0.35), V2(BR - 0.35, 0.12), V2(0, 0.12)];
  add(new THREE.LatheGeometry(pts, 64), glass({ op: 0.1, edge: 0.55 }), { p: [0, PLATE_Y, 0], ro: 6 });
}
const waterMat = new THREE.MeshPhysicalMaterial({ color: 0xd9ecf6, roughness: 0.08, transparent: true, opacity: 0.22, depthWrite: false, envMapIntensity: 1.2 });
add(new THREE.CylinderGeometry(BR - 0.12, BR - 0.12, WATER - PLATE_Y - 0.15, 64), waterMat, { p: [0, PLATE_Y + 0.15 + (WATER - PLATE_Y - 0.15) / 2, 0], ro: 1 });
// thermometer
const thermo = new THREE.Group(); thermo.position.set(4.2, PLATE_Y + 0.6, -2.6); thermo.rotation.z = -0.12; scene.add(thermo);
add(new THREE.CylinderGeometry(0.16, 0.16, 13, 12), glass({ op: 0.3, edge: 0.8 }), { p: [0, 6.5, 0], to: thermo, ro: 7 });
add(new THREE.SphereGeometry(0.24, 12, 10), new THREE.MeshStandardMaterial({ color: 0xd8302a, roughness: 0.4 }), { to: thermo });
const thermoCol = add(new THREE.CylinderGeometry(0.06, 0.06, 1, 8), new THREE.MeshStandardMaterial({ color: 0xd8302a, roughness: 0.4 }), { to: thermo });
// stand + clamp (holder moves up when the flask is lifted)
add(new RoundedBoxGeometry(6, 0.7, 6, 2, 0.25), castIron, { p: [-11, 0.35, -2], cast: true, recv: true });
add(new THREE.CylinderGeometry(0.32, 0.32, 26, 16), chrome, { p: [-11, 13, -2], cast: true });
const holder = new THREE.Group(); scene.add(holder);
const FLASK_Y = 6.4, NECK_TOP = 6.0;
add(new RoundedBoxGeometry(1.3, 1.3, 1.3, 2, 0.2), castIron, { p: [-11, FLASK_Y + 4.0, -2], to: holder, cast: true });
add(new THREE.CylinderGeometry(0.16, 0.16, 10.2, 10), chrome, { p: [-5.6, FLASK_Y + 4.0, -1.0], r: [0, -0.18, Math.PI / 2], to: holder, cast: true });
for (const s of [1, -1]) add(new RoundedBoxGeometry(1.2, 1.0, 0.4, 2, 0.12), new THREE.MeshStandardMaterial({ color: 0x8a949c, metalness: 0.7, roughness: 0.4 }), { p: [0, FLASK_Y + 4.0, s * 0.75], to: holder, cast: true });

/* ================================================================
   Heart flask
   ================================================================ */
const hs = new THREE.Shape();
hs.moveTo(0, -3);
hs.bezierCurveTo(-1.2, -1.8, -3.4, -0.6, -3.2, 1.2);
hs.bezierCurveTo(-3.0, 2.9, -1.0, 3.3, 0, 1.9);
hs.bezierCurveTo(1.0, 3.3, 3.0, 2.9, 3.2, 1.2);
hs.bezierCurveTo(3.4, -0.6, 1.2, -1.8, 0, -3);
const heartGeo = new THREE.ExtrudeGeometry(hs, { depth: 0.8, bevelEnabled: true, bevelThickness: 1.05, bevelSize: 0.75, bevelSegments: 10, curveSegments: 48 });
heartGeo.center(); heartGeo.computeVertexNormals();
heartGeo.computeBoundingBox();
const HB = heartGeo.boundingBox;                 // local bounds
const flask = new THREE.Group(); flask.position.set(0, FLASK_Y, 0); holder.add(flask);
const flaskGlass = glass({ op: 0.2, edge: 0.95, color: 0xffd9e6 });
add(heartGeo, flaskGlass, { to: flask, ro: 6 });
add(new THREE.CylinderGeometry(0.55, 0.62, 3.6, 24, 1, true), flaskGlass, { p: [0, 3.9, 0], to: flask, ro: 6 });
add(new THREE.TorusGeometry(0.6, 0.08, 8, 24), flaskGlass, { p: [0, 5.7, 0], r: [Math.PI / 2, 0, 0], to: flask, ro: 6 });
// noise map for patchy silver growth
const noiseTex = (() => {
  const big = document.createElement('canvas'); big.width = big.height = 256;
  const g = big.getContext('2d');
  g.fillStyle = '#808080'; g.fillRect(0, 0, 256, 256);
  for (const [n, a] of [[8, 0.55], [24, 0.35], [64, 0.18]]) {
    const sm = document.createElement('canvas'); sm.width = sm.height = n;
    const sg = sm.getContext('2d'), im = sg.createImageData(n, n);
    for (let i = 0; i < im.data.length; i += 4) { const v = Math.random() * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
    sg.putImageData(im, 0, 0);
    g.globalAlpha = a; g.imageSmoothingEnabled = true; g.drawImage(sm, 0, 0, 256, 256);
  }
  // stretch contrast
  const im = g.getImageData(0, 0, 256, 256); let lo = 255, hi = 0;
  for (let i = 0; i < im.data.length; i += 4) { lo = Math.min(lo, im.data[i]); hi = Math.max(hi, im.data[i]); }
  for (let i = 0; i < im.data.length; i += 4) { const v = (im.data[i] - lo) / (hi - lo) * 255; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; }
  g.putImageData(im, 0, 0);
  const t = new THREE.CanvasTexture(big); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(0.28, 0.28); return t;
})();
const mirrorPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
const liqPlane = new THREE.Plane(new THREE.Vector3(0, -1, 0), 0);
const mirrorMat = new THREE.MeshStandardMaterial({ color: 0xf4f6f8, metalness: 1, roughness: 0.04, envMapIntensity: 2.3,
  alphaMap: noiseTex, alphaTest: 1, clippingPlanes: [mirrorPlane], side: THREE.DoubleSide });
const mirror = add(heartGeo, mirrorMat, { s: [0.95, 0.95, 0.86], to: flask, ro: 2 });
const liqMat = new THREE.MeshPhysicalMaterial({ color: 0xeef4f6, roughness: 0.1, transparent: true, opacity: 0.25, depthWrite: false, clippingPlanes: [liqPlane], envMapIntensity: 1.2 });
const liquid = add(heartGeo, liqMat, { s: [0.9, 0.9, 0.78], to: flask, ro: 3 });
const sediment = add(new THREE.SphereGeometry(1, 20, 12), new THREE.MeshStandardMaterial({ color: 0x24211f, roughness: 0.95 }), { p: [0, HB.min.y * 0.86 + 0.35, 0], s: [0.01, 0.01, 0.01], to: flask });
const LEVEL_TOP = 3.7;                           // local liquid level when full
const BOTTOM = HB.min.y * 0.9;
// hot-water bubbles
const NB = 60;
const bubMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.05, transparent: true, opacity: 0.55, envMapIntensity: 2.5, depthWrite: false });
const bubbles = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 10, 8), bubMat, NB); bubbles.renderOrder = 4; bubbles.frustumCulled = false; scene.add(bubbles); bubbles.count = 0;
const bub = Array.from({ length: NB }, () => ({ on: false }));
const dummy = new THREE.Object3D();

/* ================================================================
   State
   ================================================================ */
function fresh(o = {}) {
  return { t: 0, simT: 0, subst: o.subst || 'glucose', clean: o.clean ?? true, target: o.target ?? 60, T: o.target ?? 60,
    started: false, fill: 0, r: 0, mirror: 0, powder: 0, settled: 0, shake: 0, poured: false, pour: 0, lift: 0,
    mirrorLevel: LEVEL_TOP, flags: {}, paused: false, stars: null };
}
let S = fresh();

/* ================================================================
   Simulation
   ================================================================ */
function sim(dt) {
  S.t += dt;
  S.T += (S.target - S.T) * (1 - Math.exp(-dt / 1.0));
  if (S.started && !S.poured) S.fill = Math.min(1, S.fill + dt / 1.2);
  const ready = S.started && !S.poured && S.fill >= 1;
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt);
  if (ready) {
    S.simT += dt * SPEED;
    const k = kOf(S.T, S.subst);
    const dr = (1 - S.r) * (1 - Math.exp(-k * dt * SPEED));
    S.r += dr;
    const f = mirrorShare(S.T, S.clean, S.shake > 0);
    S.mirror += dr * AG_MG * f; S.powder += dr * AG_MG * (1 - f);
    // logs
    if (!S.flags.none && SUBST[S.subst].k === 0 && S.simT > 60) { S.flags.none = true; logPush(`何も起こらない — ${SUBST[S.subst].name.split('（')[0]}は還元性を示さない`, '変化なし', '#c8d0d6'); }
    if (!S.flags.begin && S.r > 0.12) {
      S.flags.begin = true;
      if (f > 0.6) logPush('ガラスの内側に、銀がはりつき始めた', 'Ag', '#e9edf0', 'ok');
      else logPush('液が黒っぽくにごってきた — 銀が細かい粒になって出ている', '', '#3a3633');
    }
    if (!S.flags.dirty && !S.clean && S.r > 0.12) { S.flags.dirty = true; logPush('ガラスに油汚れがあって銀がつきにくく、まだらになる（つかなかった銀は液の中に出る）', '失敗', '#6b6560'); }
    if (!S.flags.hot && S.T > 78 && SUBST[S.subst].k > 0 && S.r < 0.95) { S.flags.hot = true; logPush('温度が高すぎて反応が速すぎる — 銀が黒い粉になって沈む', '失敗', '#3a3633'); }
    if (!S.flags.cold && S.T < 40 && SUBST[S.subst].k > 0 && S.simT > 240 && S.r < 0.5) { S.flags.cold = true; logPush('温度が低くて、反応がなかなか進まない', '', '#9fb3c0'); }
    if (!S.flags.shook && S.shake > 0 && SUBST[S.subst].k > 0 && S.r < 0.95) { S.flags.shook = true; logPush('ゆすると、銀がガラスにむらなくつきにくく、液の中で黒っぽい粒になって出やすい', '失敗', '#3a3633'); }
    if (!S.flags.done && S.r > 0.97) { S.flags.done = true; logPush('反応がほぼ終わった — 液を捨てて、中を見てみよう', '', '#f2b8c9'); toast('液を捨てて、中を見てみよう'); }
  }
  // powder settles to the bottom
  S.settled += (S.powder - S.settled) * (1 - Math.exp(-dt / 3));
  // pouring out and lifting
  if (S.poured) { S.pour = Math.min(1, S.pour + dt / 1.4); if (S.pour >= 1) S.lift = Math.min(1, S.lift + dt / 1.6); }
  hudDirty = true;
}

/* ================================================================
   Visuals
   ================================================================ */
const SILVER = new THREE.Color(0xf4f6f8), BLACK = new THREE.Color(0x3b3734), CLEAR = new THREE.Color(0xeef4f6), MURK = new THREE.Color(0x4e4844);
function visuals(dt) {
  holder.position.y = 6.5 * ease(S.lift);
  flask.rotation.y = S.lift > 0 ? Math.sin(S.t * 0.6) * 0.5 * S.lift : 0;
  flask.rotation.z = S.shake > 0 ? Math.sin(S.t * 28) * 0.07 * Math.min(1, S.shake) : 0;
  const fy = flask.getWorldPosition(new THREE.Vector3()).y;
  // liquid level
  const fillK = S.poured ? 1 - S.pour : S.fill;
  const lv = BOTTOM + (LEVEL_TOP - BOTTOM) * fillK;
  liqPlane.constant = fy + lv; liquid.visible = fillK > 0.01;
  mirrorPlane.constant = fy + S.mirrorLevel;
  // mirror coverage
  const total = S.mirror + S.powder;
  const cov = clamp01(S.mirror / (AG_MG * 0.85));
  mirrorMat.alphaTest = cov <= 0.005 ? 1.01 : 1 - Math.min(0.999, cov * (S.clean ? 1.05 : 1.6));
  const darkK = total > 0 ? S.powder / total : 0;
  mirrorMat.color.copy(SILVER).lerp(BLACK, S.clean ? darkK * 0.6 : 0.65);
  mirrorMat.roughness = S.clean ? 0.05 + 0.35 * darkK : 0.6;
  // murky liquid while fine silver is suspended
  const susp = Math.max(0, S.powder - S.settled) + (S.r > 0 && S.r < 0.98 && SUBST[S.subst].k > 0 ? 6 : 0);
  liqMat.color.copy(CLEAR).lerp(MURK, clamp01(susp / 30));
  liqMat.opacity = 0.25 + 0.5 * clamp01(susp / 30);
  const sd = Math.cbrt(S.settled / 40);
  sediment.scale.set(1.3 * sd + 0.001, 0.32 * sd + 0.001, 0.6 * sd + 0.001);
  // thermometer + hot-plate dial
  const h = 0.6 + (S.T - 20) / 80 * 10.5;
  thermoCol.scale.y = h; thermoCol.position.y = h / 2;
  dial.rotation.y = -(S.target - 20) / 75 * 4.5;
  hpLed.material.emissiveIntensity = S.target > 25 ? 1.8 : 0.1;
  // bubbles in the bath when the water is very hot
  let used = 0;
  S.bAcc = Math.min(3, (S.bAcc || 0) + Math.max(0, (S.T - 82) * 2.5) * dt);
  for (const b of bub) {
    if (b.on) { b.y += b.v * dt; if (b.y > WATER - 0.1) b.on = false; }
    else if (S.bAcc >= 1) { S.bAcc -= 1; const a = Math.random() * Math.PI * 2, r = 3.5 + Math.random() * 2; b.on = true; b.x = Math.cos(a) * r; b.z = Math.sin(a) * r; b.y = PLATE_Y + 0.3; b.v = 3 + Math.random() * 2; b.r = 0.08 + Math.random() * 0.1; }
    if (b.on) { dummy.position.set(b.x, b.y, b.z); dummy.scale.setScalar(b.r); dummy.updateMatrix(); bubbles.setMatrixAt(used++, dummy.matrix); }
  }
  bubbles.count = used; bubbles.instanceMatrix.needsUpdate = true;
}

/* ================================================================
   HUD
   ================================================================ */
const $ = (id) => document.getElementById(id);
let hudDirty = true, hudT = 0;
function starHtml(n) { return n == null ? '<span class="off">★★★</span>' : `${'★'.repeat(n)}<span class="off">${'★'.repeat(3 - n)}</span>`; }
function updateHud() {
  const sb = SUBST[S.subst], yes = sb.k > 0;
  $('subst').textContent = sb.name;
  $('judge').textContent = yes ? '還元性あり → 銀が出る' : '還元性なし → 何も起こらない';
  $('judge').className = yes ? 'yes' : 'no';
  $('why').textContent = sb.why;
  $('eq').textContent = yes ? 'RCHO + 2[Ag(NH₃)₂]⁺ + 3OH⁻ → RCOO⁻ + 2Ag + 4NH₃ + 2H₂O（アルデヒド基の場合）' : '反応しない';
  $('eq').className = !yes ? 'none' : (S.started && !S.poured && S.r < 0.97 ? 'lit' : '');
  $('rT').innerHTML = `${Math.round(S.T)}<small>°C</small>`;
  $('rM').innerHTML = `${Math.round(S.mirror)}<small>mg</small>`;
  $('rP').innerHTML = `${Math.round(S.powder)}<small>mg</small>`;
  $('kP').textContent = S.clean ? '黒い粉' : '液の中に出た銀';
  $('stars').innerHTML = starHtml(S.stars);
  $('sname').textContent = S.stars == null ? '液を捨てるとわかる' : ['鏡にならなかった', 'まだらな鏡', 'なかなかの鏡', 'ピカピカの鏡！'][S.stars];
}
const logEl = $('log'); const LOGMAX = 6;
function logPush(text, tag = '', color = '#fff', cls = '') {
  const e = logEl.querySelector('.empty'); if (e) e.remove();
  const li = document.createElement('li'); if (cls) li.className = cls;
  li.innerHTML = `<i style="background:${color}"></i><span>${text}</span>${tag ? `<em>${tag}</em>` : ''}`;
  logEl.prepend(li); while (logEl.children.length > LOGMAX) logEl.lastChild.remove();
}
let tt; function toast(s, big = false) { const e = $('toast'); e.textContent = s; e.className = big ? 'big' : ''; e.style.opacity = 1; clearTimeout(tt); tt = setTimeout(() => e.style.opacity = 0, 2400); }

/* ================================================================
   Controls
   ================================================================ */
function updateButtons() {
  document.querySelectorAll('#sub button').forEach(b => { b.classList.toggle('on', b.dataset.s === S.subst); b.disabled = S.started && b.dataset.s !== S.subst; });
  document.querySelectorAll('#gl button').forEach(b => { const on = (b.dataset.g === 'clean') === S.clean; b.classList.toggle('on', on); b.disabled = S.started && !on; });
  $('bGo').disabled = S.started;
  $('bShake').disabled = !S.started || S.poured;
  $('bPour').disabled = !S.started || S.poured;
  $('temp').value = S.target; $('tv').textContent = `${Math.round(S.target)} °C`;
}
function start() {
  if (S.started) return;
  S.started = true;
  logPush(`アンモニア性硝酸銀水溶液に${SUBST[S.subst].name.split('（')[0]}の水溶液を加えて、${Math.round(S.target)} °Cの湯で温めた`, '', '#f2b8c9');
  if (!S.flags.note) { S.flags.note = true; logPush('※ アンモニア性硝酸銀水溶液は、作ったらすぐ使い、使い終わったらすぐ先生が処理する薬品（長く置くと危険な物質ができる）', '', '#c8d0d6'); }
  if (S.subst === 'fructose') logPush('フルクトースは鎖状の構造で –CO–CH₂OH の部分をもち、これが還元性を示す（ケトンだが例外）', '', '#f6e3a8');
  updateButtons();
}
function shake() {
  if (!S.started || S.poured) return;
  S.shake = 1.6;
}
function pour() {
  if (!S.started || S.poured) return;
  S.poured = true; S.mirrorLevel = LEVEL_TOP;
  const n = SUBST[S.subst].k > 0 ? starsOf(S.mirror) : 0;
  S.stars = n;
  const label = ['鏡にならなかった…', 'まだらな鏡 ★', 'なかなかの鏡 ★★', 'ピカピカの鏡のハート ★★★'][n];
  logPush(`液を捨てて水で洗った → ${label}（鏡になった銀 ${Math.round(S.mirror)} mg）`, `★${n}`, n >= 2 ? '#e9edf0' : '#6b6560', n >= 2 ? 'ok' : '');
  toast(n === 3 ? '★★★ ピカピカの鏡！' : label, n === 3);
  updateButtons();
}
function setSubst(s) { if (S.started || !(s in SUBST)) return; S.subst = s; updateButtons(); hudDirty = true; }
function setClean(c) { if (S.started) return; S.clean = !!c; updateButtons(); }
function setTemp(v) { S.target = Math.max(20, Math.min(95, +v)); updateButtons(); hudDirty = true; }
function reset() {
  S = fresh({ subst: S.subst, clean: S.clean, target: S.target });
  bub.forEach(b => b.on = false);
  logEl.innerHTML = '<li class="empty">物質と条件を選んで「反応を始める」</li>';
  updateButtons(); hudDirty = true;
}
function photo(download = true) {
  renderer.render(scene, camera);
  const src = renderer.domElement, W = 1200, H = Math.round(W * src.height / src.width);
  const c = document.createElement('canvas'); c.width = W; c.height = H + 70;
  const g = c.getContext('2d');
  g.fillStyle = '#2a1520'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(src, 0, 0, W, H);
  const msg = ($('msg').value || '').trim().slice(0, 16);
  if (msg) {
    g.font = `800 64px ${JP}`; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.lineWidth = 10; g.strokeStyle = 'rgba(120,20,60,.55)'; g.strokeText(msg, W / 2, H - 70);
    g.fillStyle = '#ffffff'; g.fillText(msg, W / 2, H - 70);
  }
  g.textAlign = 'left'; g.fillStyle = '#ffffff'; g.font = `800 28px ${JP}`;
  const st = S.stars == null ? '' : `　${'★'.repeat(S.stars)}${'☆'.repeat(3 - S.stars)}`;
  g.fillText(`鏡のハート（銀鏡反応）${st}`, 24, H + 35);
  g.fillStyle = 'rgba(255,255,255,.7)'; g.font = `500 20px ${JP}`; g.textAlign = 'right';
  g.fillText('kaname-chemistry.github.io/silver-mirror-heart-3d', W - 24, H + 37);
  const url = c.toDataURL('image/png');
  if (download) { const a = document.createElement('a'); a.href = url; a.download = 'mirror-heart.png'; document.body.appendChild(a); a.click(); a.remove(); toast('写真を保存しました'); }
  return url;
}
$('bGo').addEventListener('click', start);
$('bShake').addEventListener('click', shake);
$('bPour').addEventListener('click', pour);
$('bPhoto').addEventListener('click', () => photo(true));
$('bReset').addEventListener('click', reset);
$('temp').addEventListener('input', (e) => setTemp(e.target.value));
document.querySelectorAll('#sub button').forEach(b => b.addEventListener('click', () => setSubst(b.dataset.s)));
document.querySelectorAll('#gl button').forEach(b => b.addEventListener('click', () => setClean(b.dataset.g === 'clean')));

function onResize() {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight, false); hudDirty = true;
}
addEventListener('resize', onResize);

/* ================================================================
   Loop
   ================================================================ */
reset(); onResize();
const clock = new THREE.Clock();
function frame() {
  const dt = Math.min(clock.getDelta(), 1 / 20);
  if (!S.paused) { sim(dt); visuals(dt); }
  controls.update();
  hudT += dt;
  if (hudDirty && hudT > 1 / 15) { hudT = 0; hudDirty = false; updateHud(); }
  renderer.render(scene, camera);
}
renderer.setAnimationLoop(frame);

// hook for automated checks; has no effect on normal use
window.__mirror = {
  get S() { return S; }, AG_MG, SUBST, kOf, mirrorShare, starsOf,
  start, shake, pour, setSubst, setClean, setTemp, reset, photo,
  click(id) { document.getElementById(id).click(); },
  step(sec, h = 1 / 60) { for (let t = 0; t < sec; t += h) { sim(h); visuals(h); } updateHud(); renderer.render(scene, camera); },
  hold(on) { renderer.setAnimationLoop(on ? null : frame); if (on) { controls.update(); updateHud(); renderer.render(scene, camera); } },
  view(t, p) { controls.target.set(...t); camera.position.set(...p); controls.update(); }
};
</script>
